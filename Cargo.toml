[package]
name = "padwight"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
evdev = "0.13"
iced = { version = "0.14", features = ["svg", "tokio"] }
iced_layershell = "0.19"
libc = "0.2.190"
# File chooser for importing and exporting packs, through the desktop portal.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Rasterizes the app icon for the tray and window (iced already pulls it in).
resvg = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["io-util", "net", "rt", "time"] }
toml = "1.1.6"
zbus = "5"
# StatusNotifierItem tray icon.
ksni = { version = "0.3.6", features = ["blocking"] }
# iced_layershell's devtools (iced_exdevtools 0.19.1) don't build against winit-core
# 0.31.0-beta.3; pin the beta they were written for. Not used directly.
winit-core = "=0.31.0-beta.2"

[lints.clippy]
# Keep code compact and units small so they are cheaper to read.
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
# Keep debug noise out of test output.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
